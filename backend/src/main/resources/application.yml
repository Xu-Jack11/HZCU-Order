spring:
  profiles:
    active: dev
  application:
    name: hzcu-order

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hzcuorder}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

server:
  port: 8080

app:
  jwt:
    secret: dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3ItaHpjdS1vcmRlci1zeXN0ZW0tYmFja2VuZA==
    expiration: 604800000  # 7 days in milliseconds

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

wechat:
  # 微信小程序AppID
  appid: ${WECHAT_APPID:wx1e39a676fdf7c829}
  # 微信小程序AppSecret
  secret: ${WECHAT_SECRET:abcd1234efgh5678ijkl9012mnop3456}
  mch:
    mch-id: ${WECHAT_MCH_ID:1234567890}
    api-v3-key: ${WECHAT_API_V3_KEY:key1234567890abcdef}
    notify-url: ${WECHAT_NOTIFY_URL:https://api.hzcu.com/api/v1/payment/callback}
