spring:
  profiles:
    active: dev
  application:
    name: hzcu-order

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hzcuorder}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

wechat:
  app-id: ${WECHAT_APP_ID:wx1234567890abcdef}
  app-secret: ${WECHAT_APP_SECRET:abcdef1234567890}
  mch:
    mch-id: ${WECHAT_MCH_ID:1234567890}
    api-v3-key: ${WECHAT_API_V3_KEY:key1234567890abcdef}
    notify-url: ${WECHAT_NOTIFY_URL:https://api.hzcu.com/api/v1/payment/callback}
